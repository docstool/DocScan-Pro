<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhotoEdit Pro — Free Photo Editor</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">Photo<span>Edit</span> <small>PRO</small></div>
<div class="actions">
<label class="btn primary">Upload<input id="file" type="file" accept="image/*" hidden></label>
<button class="btn" id="undo" disabled>Undo</button><button class="btn" id="redo" disabled>Redo</button>
<button class="btn" id="reset" disabled>Reset</button><button class="btn primary" id="download" disabled>Download</button>
</div></header>
<div class="layout">
<aside>
<nav><button class="tab active" data-tab="adjust">Adjust</button><button class="tab" data-tab="filters">Filters</button><button class="tab" data-tab="size">Size</button><button class="tab" data-tab="tools">Tools</button><button class="tab" data-tab="text">Text</button></nav>

<section id="adjust" class="tabpane active"><h3>Adjustments</h3>
<div id="sliders"></div>
</section>

<section id="filters" class="tabpane"><h3>Filters</h3><div class="filtergrid">
<button class="filter" data-filter="none">Normal</button><button class="filter" data-filter="grayscale(1)">B&W</button>
<button class="filter" data-filter="sepia(.9)">Sepia</button><button class="filter" data-filter="contrast(1.25) saturate(1.2)">Dramatic</button>
<button class="filter" data-filter="saturate(1.5) brightness(1.08)">Bright</button><button class="filter" data-filter="sepia(.25) saturate(.75) contrast(1.05)">Vintage</button>
<button class="filter" data-filter="saturate(.7) hue-rotate(180deg)">Cool</button><button class="filter" data-filter="sepia(.15) saturate(1.35) brightness(1.04)">Warm</button>
<button class="filter" data-filter="grayscale(.6) contrast(1.2)">Fade</button><button class="filter" data-filter="brightness(.85) contrast(1.25)">Moody</button>
</div></section>

<section id="size" class="tabpane"><h3>Image Size</h3>
<label>Width <input id="width" type="number" min="1"></label><label>Height <input id="height" type="number" min="1"></label>
<label class="check"><input id="lock" type="checkbox" checked> Lock aspect ratio</label>
<div class="presets"><button class="btn preset" data-w="1080" data-h="1080">Instagram 1:1</button><button class="btn preset" data-w="1080" data-h="1350">Instagram Portrait</button><button class="btn preset" data-w="1280" data-h="720">YouTube</button><button class="btn preset" data-w="1080" data-h="1920">Story / Status</button><button class="btn preset" data-w="600" data-h="600">Passport Square</button></div>
</section>

<section id="tools" class="tabpane"><h3>Alteration</h3>
<div class="toolgrid"><button class="btn" id="rotateL">↶ Rotate</button><button class="btn" id="rotateR">↷ Rotate</button><button class="btn" id="flipH">↔ Flip H</button><button class="btn" id="flipV">↕ Flip V</button></div>
<label>Border <input id="border" type="range" min="0" max="50" value="0"><output id="borderOut">0</output></label>
<label>Vignette <input id="vignette" type="range" min="0" max="100" value="0"><output id="vignetteOut">0</output></label>
<p class="hint">Crop and freehand drawing are planned for the next version.</p>
</section>

<section id="text" class="tabpane"><h3>Add Text</h3>
<input id="textValue" class="textinput" placeholder="Enter your text">
<label>Size <input id="textSize" type="range" min="12" max="180" value="48"><output id="textSizeOut">48</output></label>
<label>Color <input id="textColor" type="color" value="#ffffff"></label>
<button class="btn primary full" id="addText">Add Text</button>
</section>
</aside>

<main><div id="drop" class="drop"><div id="empty"><div class="plus">＋</div><h2>Drop your photo here</h2><p>or click Upload</p></div><canvas id="canvas"></canvas></div>
<div class="info" id="info">No image loaded • Editing is done locally in your browser.</div></main>
</div>
<script src="script.js"></script>
</body></html>
